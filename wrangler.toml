name = "fxtiktok-rewrite"
compatibility_date = "2024-09-23"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]

vars = { WORKER_ENV = "production" }

[alias]
"redis" = "./src/shims/redis-shim.mjs"

[env.staging]
name = "fxtiktok-rewrite-dev"
vars = { WORKER_ENV = "staging" }

[observability.logs]
enabled = true

[env.local]
vars = { WORKER_ENV = "local" }
