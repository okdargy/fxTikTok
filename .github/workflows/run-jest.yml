name: Run Unit Tests with Bun

on:
  push:
    branches:
      - main
      - master
      - hono-rewrite
  pull_request:
    branches:
      - main
      - master
      - hono-rewrite

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Bun tests
        run: bun run test
